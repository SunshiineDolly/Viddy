name: Build Viddy for Mac

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-app]
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - package*.json
      - .github/workflows/macos.yml

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --release --locked --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml
      - name: Verify native Mac preview loading, controls and restart
        env:
          PURETUBE_ISOLATED_PROFILE: ${{ runner.temp }}/viddy-preview-check
          VIDDY_PREVIEW_REPORT: ${{ runner.temp }}/viddy-preview-report.json
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml --example mac-preview-check --features tauri/custom-protocol
          python3 - <<'PY'
          import subprocess, json, os, time
          subprocess.run(['src-tauri/target/aarch64-apple-darwin/release/examples/mac-preview-check'], timeout=100, check=True)
          for _ in range(100):
              with open(os.environ['VIDDY_PREVIEW_REPORT']) as f: report = json.load(f)
              if report.get('restartVerified'): break
              time.sleep(.2)
          assert report.get('restartVerified') and report.get('previewsCanBeDisabled') and report.get('mainPlayerReady'), report
          assert any(s.get('state') == 'ready' for s in report.get('states', [])), report
          if report.get('externalPlaybackBlockedByYouTube'):
              print('::warning::YouTube bot verification blocked live playback on this runner; native player loading, preference and restart passed. Real Mac playback remains unverified.')
          else:
              assert report.get('videoTimeAdvanced'), report
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viddy-native-preview-report
          path: ${{ runner.temp }}/viddy-preview-report.json
          if-no-files-found: ignore
      - name: Import stable Viddy release identity
        if: github.event_name != 'pull_request'
        env:
          VIDDY_MAC_CERTIFICATE: ${{ secrets.VIDDY_MAC_CERTIFICATE }}
          VIDDY_MAC_CERTIFICATE_PASSWORD: ${{ secrets.VIDDY_MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$VIDDY_MAC_CERTIFICATE"
          test -n "$VIDDY_MAC_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/viddy-signing.keychain-db"
          python3 - <<'PY'
          import base64, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'viddy-signing.p12')
          with open(path, 'wb') as f: f.write(base64.b64decode(os.environ['VIDDY_MAC_CERTIFICATE']))
          os.chmod(path, 0o600)
          PY
          security create-keychain -p "$VIDDY_MAC_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$VIDDY_MAC_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/viddy-signing.p12" -P "$VIDDY_MAC_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$VIDDY_MAC_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" src-tauri/macos/signing-certificate.pem
          identity="$(openssl x509 -in src-tauri/macos/signing-certificate.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          echo "VIDDY_MAC_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          python3 - "$identity" <<'PY'
          import subprocess, sys
          result = subprocess.run(['security', 'find-identity', '-v', '-p', 'codesigning'], capture_output=True, text=True, check=True)
          assert sys.argv[1] in result.stdout, 'The expected stable signing identity is unavailable'
          PY
          rm -f "$RUNNER_TEMP/viddy-signing.p12"
      - name: Verify Keychain access across signed updates
        if: github.event_name != 'pull_request'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml --example mac-keychain-check
          python3 scripts/verify-mac-signing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viddy-signing-verification
          path: ${{ runner.temp }}/viddy-signing-report.json
          if-no-files-found: ignore
      - name: Build universal app and disk image
        run: |
          if [ -n "$VIDDY_MAC_SIGNING_IDENTITY" ]; then
            python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'viddy-signing.json'), 'w') as f:
              json.dump({'bundle': {'macOS': {'signingIdentity': os.environ['VIDDY_MAC_SIGNING_IDENTITY']}}}, f)
          PY
            npm run tauri build -- --ci --target universal-apple-darwin --config "$RUNNER_TEMP/viddy-signing.json"
          else
            npm run tauri build -- --ci --target universal-apple-darwin
          fi
      - name: Verify both architectures and app signature
        run: |
          lipo src-tauri/target/universal-apple-darwin/release/bundle/macos/Viddy.app/Contents/MacOS/puretube -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Viddy.app
          if [ -n "$VIDDY_MAC_SIGNING_IDENTITY" ]; then
            codesign -d -r- src-tauri/target/universal-apple-darwin/release/bundle/macos/Viddy.app 2>&1 | tee "$RUNNER_TEMP/viddy-app-requirement.txt"
            python3 - <<'PY'
          import os, subprocess
          app = 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Viddy.app'
          result = subprocess.run(['codesign', '-d', '--verbose=4', app], capture_output=True, text=True, check=True)
          assert 'Signature=adhoc' not in result.stderr
          assert 'Authority=Viddy Mac Release Identity' in result.stderr
          PY
          fi
      - name: Smoke test native app startup
        run: |
          app_binary="$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos/Viddy.app/Contents/MacOS/puretube"
          export PURETUBE_ISOLATED_PROFILE="$RUNNER_TEMP/viddy-smoke-profile"
          "$app_binary" > "$RUNNER_TEMP/viddy-startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/viddy-startup.log"
            exit 1
          fi
          test -f "$PURETUBE_ISOLATED_PROFILE/library.sqlite3"
      - name: Prepare test download
        run: |
          mkdir -p mac-download
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg mac-download/
          version="$(node -p "require('./package.json').version")"
          app_dir="$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          tar -czf "mac-download/Viddy_${version}_universal.app.tar.gz" -C "$app_dir" Viddy.app
          cp docs/MACOS-TESTING.md mac-download/READ-ME-FIRST.md
          cd mac-download
          shasum -a 256 *.dmg *.app.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Viddy-macOS-universal
          path: mac-download/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always() && github.event_name != 'pull_request'
        run: security delete-keychain "$RUNNER_TEMP/viddy-signing.keychain-db" || true

