<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viddy video player</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font:14px system-ui}iframe{width:100%;height:100%;border:0;display:block}p{padding:20px}</style></head><body><script>
(() => {
 const parameters=new URLSearchParams(location.hash.slice(1)),id=parameters.get('id'),preview=parameters.get('mode')==='preview',nonce=parameters.get('nonce');
 if(!/^[\w-]{11}$/.test(id??'')){document.body.textContent='Open a video in Viddy to play it here.';return}
 const autoStart=preview||parameters.get('autoplay')!=='0';
 let player,ready=false,startAttempts=0,startTimer,playing=false,failed=false;
 function start(){
  if(!ready||!autoStart||playing||failed||startAttempts>=3)return;
  startAttempts++;if(preview)player.mute();startTimer=setTimeout(blocked,1500);player.playVideo();
 }
 function blocked(){
  if(!autoStart||playing||failed)return;
  clearTimeout(startTimer);
  if(!ready)return;
  if(startAttempts<3)startTimer=setTimeout(start,300*startAttempts);
  else startTimer=setTimeout(()=>{if(!playing&&!failed)send(preview?'blocked':'autoplay-blocked')},500);
 }
 addEventListener('pagehide',()=>{clearTimeout(startTimer)});
 function send(event,value,sample){parent.postMessage(preview?{type:'viddy-video-preview',id,state:event,code:value}:{type:'viddy-player',nonce,event,value,sample},'*')}
 function sample(){if(!ready||preview)return;send('sample',null,{time:player.getCurrentTime(),duration:player.getDuration(),state:player.getPlayerState(),volume:player.getVolume(),muted:player.isMuted(),url:player.getVideoUrl()})}
 const frame=document.createElement('iframe');frame.title=preview?'Muted YouTube video preview':'YouTube video player';frame.allow='autoplay *; encrypted-media *; fullscreen *; picture-in-picture *';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';
 const query=new URLSearchParams({autoplay:'0',controls:preview?'0':'1',mute:preview?'1':'0',playsinline:'1',rel:'0',enablejsapi:'1',origin:location.origin,widget_referrer:'https://app.puretube.desktop/'});
 frame.src='https://www.youtube.com/embed/'+id+'?'+query;document.body.appendChild(frame);
 addEventListener('message',event=>{
  const d=event.data;if(preview||event.source!==parent||d?.type!=='viddy-player-command'||d.nonce!==nonce||!ready||!Array.isArray(d.args))return;
  if(['playVideo','pauseVideo','mute','unMute'].includes(d.method)&&d.args.length===0)player[d.method]();
  else if(d.method==='setVolume'&&Number.isFinite(d.args[0]))player.setVolume(Math.max(0,Math.min(100,d.args[0])));
  else if(d.method==='seekTo'&&Number.isFinite(d.args[0]))player.seekTo(Math.max(0,d.args[0]),!!d.args[1]);
  else if(d.method==='loadVideoById'&&typeof d.args[0]==='string'&&/^[\w-]{11}$/.test(d.args[0]))player.loadVideoById(d.args[0]);
  sample();
 });
 window.onYouTubeIframeAPIReady=function(){player=window.viddyPreviewPlayer=new YT.Player(frame,{events:{
  onReady:e=>{ready=true;sample();send('ready');start()},
  onStateChange:e=>{if(e.data===1){playing=true;clearTimeout(startTimer)}sample();if(preview){if(e.data===1)send('playing');if(e.data===0)send('ended')}else send('state',e.data)},
  onError:e=>{failed=true;clearTimeout(startTimer);send('error',e.data)},onAutoplayBlocked:blocked
 }})};
 const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>send('error',0);document.body.appendChild(script);setInterval(sample,250);
})();
</script></body></html>
