[package]
name = "puretube"
version = "0.26.9"
edition = "2021"
description = "A quiet desktop for YouTube"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.4"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"


[features]
default = ["tauri/tray-icon"]
